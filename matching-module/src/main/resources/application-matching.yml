# Configuración base de `matching` (ajustes independientes del perfil). Los valores por defecto viven en
# `MatchingProperties`; aquí solo se enlazan las variables de entorno de Ollama (`.env.example`).
jobseeker:
  matching:
    # Candidatos sugeridos (REQ-R-11): cuántos perfiles únicos puede ver un reclutador verificado por ventana.
    # Recuperación vectorial (TD-012): candidatos que explora el índice HNSW por consulta.
    retrieval:
      ef-search: ${MATCHING_RETRIEVAL_EF_SEARCH:100}
    # Puntaje de compatibilidad (BR-MATCH-05, ADR-0017): pesos por dimensión, alfa y completitud mínima. Sin los
    # parámetros de Platt (calibration.a y calibration.b) el puntaje se publica marcado como NO calibrado.
    scoring:
      alpha: ${MATCHING_SCORING_ALPHA:0.30}
      min-completeness: ${MATCHING_SCORING_MIN_COMPLETENESS:0.5}
      # Puntaje guardado (TD-036): pares guardados que se recalculan por entidad y pasada.
      recompute-max-pairs: ${MATCHING_SCORING_RECOMPUTE_MAX_PAIRS:200}
    suggestions:
      view-quota: ${MATCHING_PROFILE_VIEW_QUOTA:200}
      # Tolerancia (puntos) con que OPEN_TO_WORK adelanta en el orden; 1 es la resolución del porcentaje mostrado (BR-MATCH-07, ADR-0030).
      tie-tolerance: ${MATCHING_SUGGESTIONS_TIE_TOLERANCE:1.0}
    embedding:
      host: ${OLLAMA_HOST:localhost}
      port: ${OLLAMA_PORT:11434}
      # Provisional hasta que el protocolo de 300 pares fije el definitivo (ADR-0018).
      model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

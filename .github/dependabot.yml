# Actualizaciones automáticas de dependencias.
version: 2
updates:
  # Las acciones van fijadas por SHA (ver Settings > Actions); Dependabot propone el SHA nuevo y
  # deja la versión en el comentario, así que fijar no congela las correcciones de seguridad.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Imágenes base del Dockerfile, fijadas por digest: sin esto el digest nunca se mueve y un cambio
  # de la imagen base llega sin revisión, o nunca.
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # ADR-0014 fija Java 25 (LTS): no se proponen JDK mayores en la imagen de ejecución. Para la imagen
    # de Maven el JDK va dentro de la etiqueta y no se puede filtrar por versión: esas PRs se revisan a mano.
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [">=26"]

  # Imágenes del stack local (docker-compose.yml), también fijadas por digest.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # ADR-0028: la versión mayor de PostgreSQL va en el sufijo de la etiqueta de pgvector (`-pg17`).
    # Dependabot NO garantiza conservar los componentes de una etiqueta: con la imagen de Maven cambió
    # el JDK de la etiqueta (25 → 26) y la volvió flotante. Toda PR que cambie `-pg17`, el JDK de una
    # etiqueta o su forma se revisa a mano y se rechaza si contradice un ADR. Las PRs de Dependabot no
    # se fusionan sin revisar (no hay protección de rama mientras el repositorio sea privado).

# CI del backend: compila los módulos y ejecuta `mvn verify`, que incluye formato (Spotless), análisis
# estático (PMD), las pruebas unitarias y de integración, las reglas de arquitectura ARCH-01..14
# (ADR-0015) y el informe de cobertura (JaCoCo). Una violación de cualquiera rompe el build.
name: ci-backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Privilegio mínimo: este workflow no necesita escribir en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma PR vuelve inútil la ejecución anterior; los push a main nunca se cancelan.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (mvn verify)
    runs-on: ubuntu-latest
    # Un paso colgado consume seis horas de runner si no se limita.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 25 (ADR-0014). La caché de Maven la gestiona la propia acción.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Las pruebas con Testcontainers (migraciones, Postgres 17 con pgvector — ADR-0028) usan el
      # Docker que ya trae ubuntu-latest; no hace falta preparar nada más.
      - name: Build and test
        run: mvn -B -ntp verify

      # Arranca el jar ejecutable contra Postgres 17 y comprueba salud y migraciones: las pruebas usan su
      # propio classpath y no ven un problema de empaquetado.
      - name: Smoke test the executable jar
        run: bash scripts/smoke-test-jar.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: ignore
          retention-days: 7

  # El stack local completo con la aplicación en contenedor: valida a la vez el Dockerfile, el
  # docker-compose.yml, Prometheus, Grafana y el arranque real. Lo que las pruebas de Maven no ven.
  # Análisis estático y cobertura en SonarCloud. Espera a la puerta de calidad: si no se cumple, el job
  # falla y la PR no se puede fusionar (ruleset de `main`). Va en paralelo al build: repite las pruebas
  # a cambio de no pasar artefactos entre jobs.
  sonar-analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar atribuye el código nuevo con el historial de git; un clon superficial lo falsea.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Analyze and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

  stack-and-image:
    name: Local stack and container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Genera .env con valores aleatorios, construye la imagen de la aplicación y espera a que todo
      # esté sano (los healthchecks de docker-compose.yml).
      - name: Start the stack with the app container
        run: bash scripts/dev-up.sh --app

      - name: Smoke test the stack
        run: bash scripts/smoke-test-stack.sh

      - name: Show the logs if something failed
        if: failure()
        run: docker compose --profile app ps -a && docker compose --profile app logs --tail=150

      # Escaneo de vulnerabilidades de la imagen: una corregible de severidad ALTA o CRÍTICA rompe el
      # build. Las que aún no tienen corrección (--ignore-unfixed) no se pueden resolver actualizando.
      - name: Install Trivy (pinned version and checksum)
        run: bash scripts/fetch-ci-tool.sh trivy "$RUNNER_TEMP/bin"

      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        run: |
          status=0
          "$RUNNER_TEMP/bin/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table --output trivy-report.txt jobseeker-app:dev || status=$?
          cat trivy-report.txt
          exit "$status"

      - name: Upload the image scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7


# Comprobaciones del repositorio que no necesitan código Java: secretos, workflows, documentación,
# configuración, SQL (seguridad e inmutabilidad de las migraciones) y la configuración del stack local. Es la primera pieza del CI real (el build, ArchUnit y Sonar llegan en el Sprint 0
# junto con el esqueleto andante).
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Privilegio mínimo: ningún job necesita escribir en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma PR vuelve inútil la ejecución anterior; los push a main nunca se cancelan.
concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historial completo: un secreto borrado en un commit posterior sigue estando en el historial.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version and checksum)
        run: bash scripts/fetch-ci-tool.sh gitleaks "$RUNNER_TEMP/bin"
      - name: Scan the repository history
        run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --config .gitleaks.toml .'

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (pinned version and checksum)
        run: bash scripts/fetch-ci-tool.sh actionlint "$RUNNER_TEMP/bin"
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/bin/actionlint" -color'

  docs-and-config:
    name: Documentation references and .env.example drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation references exist
        run: python3 scripts/check_doc_links.py
      - name: .env.example matches the configuration
        run: python3 scripts/check_env_drift.py
      # Los checks requeridos del ruleset de `main` existen como jobs y la protección no se debilita.
      - name: Main ruleset matches the workflows
        run: python3 scripts/check_ruleset.py
      # Un marcador de trabajo pendiente lleva dueño y razón (coding-standards.md §5).
      - name: Work markers have an owner and a reason
        run: bash scripts/check-work-markers.sh
      # El repositorio no menciona herramientas de asistencia de código ni sus archivos locales.
      - name: No tooling references in tracked files
        run: bash scripts/check-no-tooling-references.sh

  sql-lint:
    name: Migration safety lint (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install squawk (pinned version and checksum)
        run: bash scripts/fetch-ci-tool.sh squawk "$RUNNER_TEMP/bin"
      # Analiza con el parser de Postgres cada migración: bloqueos, cambios que rompen a la aplicación
      # en marcha y operaciones destructivas (ADR-0027). La configuración está en .squawk.toml.
      - name: Lint every migration
        run: git ls-files -z -- ':(glob)*/src/main/resources/db/migration/*.sql' | xargs -0 "$RUNNER_TEMP/bin/squawk"

  migration-immutability:
    name: Published migrations are immutable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historial completo: la comprobación compara con lo que ya llegó a la rama base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the immutability script
        run: bash scripts/test-check-migration-immutability.sh
      - name: No published migration changed
        env:
          # En una PR se compara con la rama base; en un push, con el commit anterior.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash scripts/check-migration-immutability.sh "$BASE"

  infra-config:
    name: Local stack configuration (compose, Prometheus, Alertmanager, Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Valida con las herramientas oficiales de cada pieza, con las mismas imágenes (por digest) que
      # usa docker-compose.yml: Compose, promtool (configuración, reglas y sus pruebas) y amtool.
      - name: Validate the stack configuration
        run: bash scripts/check-infra-config.sh

  # Un solo nombre estable para exigir en la protección de rama (cuando el plan del repositorio la
  # permita) en vez de enumerar cada job; `if: always()` evita que un job omitido cuente como éxito.
  repo-checks-passed:
    name: repo-checks passed
    runs-on: ubuntu-latest
    needs: [secrets-scan, workflow-lint, docs-and-config, sql-lint, migration-immutability, infra-config]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            [ "$r" = "success" ] || { echo "Un job no terminó en success"; exit 1; }
          done

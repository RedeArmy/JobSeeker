# Clave de cifrado SOLO para pruebas (32 bytes de relleno, no es un secreto): sin ella el contexto
# no arranca con Clavaris configurado. Se suma a application.yml, no lo reemplaza.
jobseeker.auth.encryption.active-kid=test
jobseeker.auth.encryption.keys=test:dGVzdC1vbmx5LWtleS1ub3QtYS1zZWNyZXQtMDAwMDA=

# El límite de tasa comparte Redis y dirección (127.0.0.1) entre todas las pruebas: se apaga salvo en
# las que lo prueban, que lo encienden con su propia configuración.
jobseeker.ratelimit.enabled=false

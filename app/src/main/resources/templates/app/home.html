<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>JobSeeker</title>
  <!-- ADR-0020: el token CSRF viaja en una <meta>; HTMX lo adjunta a cada petición (hx-headers). -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <!-- HTMX sin eval y sin estilos en línea, para poder mantener una CSP sin 'unsafe-inline'. -->
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">
  <main>
    <h1>JobSeeker</h1>
    <p>Sesión iniciada.</p>
    <dl>
      <dt>Cuenta</dt><dd id="account-id" th:text="${accountId}">id</dd>
      <dt>Capacidades</dt><dd id="capabilities" th:text="${#strings.setJoin(capabilities, ', ')}">CANDIDATE</dd>
    </dl>
    <p><a th:href="@{/app/profile}">Mi perfil profesional</a></p>
    <p><a th:href="@{/app/candidate-profile}">Mi perfil de candidato</a></p>
    <form th:action="@{/app/logout}" method="post">
      <button type="submit">Cerrar sesión</button>
    </form>
  </main>
</body>
</html>

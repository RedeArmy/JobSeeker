# Configuración común a todos los perfiles del único desplegable (ADR-0026).
#
# Por qué la configuración de perfil vive solo aquí: con un único classpath, dos módulos que
# aporten `application-dev.yml` chocan por nombre y Spring solo carga uno, en silencio. Los
# módulos de negocio aportan únicamente `application-<modulo>.yml` (nombre único), que se
# importa explícitamente abajo; los perfiles dev y prod están en este módulo.
spring:
  application:
    name: jobseeker
  # Algo mayor que el máximo de un CV (5 MB, ADR-0021): así un archivo de 5 a 6 MB recibe el
  # FILE_REJECTED del caso de uso, y lo que pasa de 6 MB se corta antes de leerlo entero.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  task:
    scheduling:
      # TD-002: con el hilo único por defecto, el trabajador de embeddings (llamadas a Ollama de
      # segundos) retrasaría el sondeo de la bandeja y cualquier lote futuro. Un `fixedDelay` ya
      # impide que una misma tarea se solape consigo misma, así que el pool solo separa tareas.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
  config:
    import:
      - optional:classpath:application-auth.yml
      - optional:classpath:application-cv.yml
      - optional:classpath:application-job.yml
      - optional:classpath:application-matching.yml
      - optional:classpath:application-ats.yml
      - optional:classpath:application-tracker.yml

  flyway:
    postgresql:
      # ADR-0027 decisión 8: con el bloqueo transaccional por defecto, CREATE INDEX CONCURRENTLY
      # espera a la propia transacción de Flyway y no termina nunca.
      transactional-lock: false
    # ADR-0027: una migración que espere más de 10 s un bloqueo falla en vez de dejar sin servicio
    # las escrituras de producción. Se fija una vez para toda conexión de Flyway.
    init-sqls:
      - SET lock_timeout = '10s'

jobseeker:
  auth:
    clavaris:
      # Cliente OIDC de Clavaris (ADR-0020). Sin valores por defecto: si faltan, el login responde
      # «no configurado» pero la aplicación arranca (el registro se resuelve de forma perezosa).
      issuer-uri: ${CLAVARIS_ISSUER_URI:}
      client-id: ${CLAVARIS_CLIENT_ID:}
      client-secret: ${CLAVARIS_CLIENT_SECRET:}
    # API con Bearer (ADR-0020, superficie B). Sin audiencias configuradas solo vale el `client_id`; sin
    # orígenes CORS la API no acepta peticiones de otros orígenes.
    api:
      allowed-audiences: ${CLAVARIS_ALLOWED_AUDIENCES:}
      allowed-origins: ${API_CORS_ALLOWED_ORIGINS:}
      clock-skew: ${API_TOKEN_CLOCK_SKEW_SECONDS:30}s
    # Receptor de webhooks (ADR-0020, superficie C). Sin secreto el receptor responde 503 y no
    # acepta nada. `previous-secret` solo mientras dura la rotación del secreto en Clavaris.
    webhook:
      secret: ${CLAVARIS_WEBHOOK_SECRET:}
      previous-secret: ${CLAVARIS_WEBHOOK_SECRET_PREVIOUS:}
      tolerance: ${CLAVARIS_WEBHOOK_TOLERANCE_SECONDS:300}s
    # Operadores de la plataforma (BR-ACCT-11): las cuentas que pueden verificar a un reclutador. Una lista de
    # identificadores de cuenta (el `sub` de Clavaris) separados por comas. Vacía por defecto: sin ella nadie
    # es operador y el canal de verificación responde como si no existiera.
    operators:
      account-ids: ${AUTH_OPERATOR_ACCOUNT_IDS:}
    session:
      idle-timeout: ${SESSION_IDLE_TIMEOUT_MINUTES:30}m
      absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:8}h
    # Cifrado en reposo del refresh token (ADR-0020, regla 3). Sin clave y con Clavaris configurado la
    # aplicación no arranca: nadie podría iniciar sesión.
    encryption:
      active-kid: ${TOKEN_ENCRYPTION_ACTIVE_KID:}
      keys: ${TOKEN_ENCRYPTION_KEYS:}
    # Prueba de vida de la sesión (ADR-0020, reglas 1-8 y 12): se calibra con la latencia real.
    liveness:
      renewal-interval: ${LIVENESS_RENEWAL_INTERVAL_MINUTES:10}m
      clavaris-unavailable-margin: ${LIVENESS_CLAVARIS_UNAVAILABLE_MARGIN_HOURS:2}h
      fail-open-enabled: ${LIVENESS_FAIL_OPEN_ENABLED:true}
      retry-once-within-grace: ${LIVENESS_RETRY_ONCE_WITHIN_GRACE:false}

  # Límite de tasa (ADR-0011): token bucket en Redis. Valores iniciales a calibrar con tráfico real; el
  # nombre de cada política lo asigna `RateLimitRules`. `capacity` es la ráfaga; se reponen
  # `refill-tokens` cada `refill-period`.
  # ADR-0021: almacén S3 y antivirus. Vacíos, la aplicación arranca y las subidas responden 503.
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
  malware-scan:
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
  ratelimit:
    enabled: true
    policies:
      # Inicio y callback del flujo OIDC, por IP (mitiga fuerza bruta; el formulario vive en Clavaris).
      login: {capacity: 10, refill-tokens: 10, refill-period: 1m, key: IP}
      # Receptor de webhooks, por IP: Clavaris reintenta en ráfagas, y así se acota a quien no lo es.
      webhook: {capacity: 120, refill-tokens: 120, refill-period: 1m, key: IP}
      # Mutaciones por cuenta: moderado.
      write: {capacity: 30, refill-tokens: 30, refill-period: 1m, key: ACCOUNT}
      # Lecturas por cuenta: más permisivo.
      read: {capacity: 120, refill-tokens: 120, refill-period: 1m, key: ACCOUNT}
      # Candidatos sugeridos: la superficie más sensible al raspado de datos (amenaza T-N1); más estricto que la
      # lectura, además de la cuota de perfiles únicos de `matching`.
      suggestions: {capacity: 10, refill-tokens: 10, refill-period: 1m, key: ACCOUNT}
      # Subidas de archivos (multipart): cada una cuesta un escaneo antivirus y almacenamiento (ADR-0021 §4).
      upload: {capacity: 10, refill-tokens: 10, refill-period: 1h, key: ACCOUNT}

  # Bandeja de salida (ADR-0016): sondeo, reintentos con retroceso y tope de intentos.
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL_MILLIS:1000}ms
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

# OpenAPI (ADR-0010). Apagado por defecto: el spec describe toda la superficie de ataque y no debe
# estar público en producción. El perfil `dev` lo enciende; Swagger UI se activa con el mismo interruptor.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Prometheus consulta el único /actuator/prometheus de `app` (ADR-0012).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      # ADR-0012 (enmendado): registro JSON con el soporte nativo de Spring Boot, sin PII (BR-DATA-01).
      console: logstash

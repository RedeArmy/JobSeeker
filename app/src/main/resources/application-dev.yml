# Perfil dev: Postgres 17 local en Docker (ADR-0028). Los valores salen de .env (ver .env.example).
spring:
  datasource:
    url: jdbc:postgresql://${DB_DEV_HOST}:${DB_DEV_PORT}/${DB_DEV_NAME}
    username: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}

# En desarrollo el bucket se crea solo si falta (en producción lo crea operaciones, ADR-0021).
jobseeker:
  storage:
    create-bucket-if-missing: true

# Documentación de la API visible solo en desarrollo (ADR-0010).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

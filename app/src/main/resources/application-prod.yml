# Perfil prod: Supabase (ADR-0026). Sin credenciales escritas en el código: todo sale de variables de
# entorno (ver .env.example). NO verificado contra un proyecto real de Supabase (10-spike-r13 §6).
spring:
  datasource:
    # Pooler en modo transacción (puerto 6543): sin sentencias preparadas del lado del servidor.
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?prepareThreshold=0
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  flyway:
    # Flyway usa la conexión directa (5432): sus bloqueos de sesión no funcionan a través del pooler.
    url: jdbc:postgresql://${SUPABASE_DB_DIRECT_HOST}:${SUPABASE_DB_DIRECT_PORT}/${SUPABASE_DB_NAME}
    user: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

jobseeker:
  auth:
    session:
      # El prefijo `__Host-` exige HTTPS, Path=/ y ningún Domain (ADR-0020).
      cookie-name: __Host-SESSION
      secure-cookie: true
